<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F4"/>
      <stop offset="50%" stop-color="#FCE7EC"/>
      <stop offset="100%" stop-color="#F7D6DE"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E88A9C"/>
      <stop offset="100%" stop-color="#C5586F"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D9778A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#D9778A" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Center Decorative Glow Circle -->
  <circle cx="256" cy="256" r="170" fill="#FFFFFF" fill-opacity="0.65" filter="url(#softShadow)"/>

  <!-- Boutique Scissor Brand Logo -->
  <g transform="translate(136, 136) scale(10)" stroke="url(#roseGold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lucide Scissors path -->
    <circle cx="6" cy="6" r="3"/>
    <path d="M8.12 8.12 12 12"/>
    <path d="M20 4 8.12 15.88"/>
    <circle cx="6" cy="18" r="3"/>
    <path d="M14.8 14.8 20 20"/>
  </g>

  <!-- Brand Label -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#C5586F" letter-spacing="1.5">
    ARUNA CREATIONS
  </text>
</svg>
